<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FAQ Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Syne:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"/>
</head>
<body>

  <div class="app">
    <div class="chat-card">

      <!-- Header -->
      <div class="chat-header">
        <div class="avatar-ring">🤖</div>
        <div class="header-text">
          <h2>FAQ Assistant</h2>
          <p>E-commerce Support · Powered by NLTK + TF-IDF<br>Developed by ABDUL MAJID</p>
        </div>
        <div class="online-dot" title="Online"></div>
      </div>

      <!-- Quick Suggestion Buttons -->
      <div class="suggestions" id="suggestions">
        <button class="sug-btn" onclick="sendSuggestion('How do I track my order?')">📦 Track my order</button>
        <button class="sug-btn" onclick="sendSuggestion('What is your return policy?')">↩️ Return policy</button>
        <button class="sug-btn" onclick="sendSuggestion('Do you offer international shipping?')">🌍 International shipping</button>
        <button class="sug-btn" onclick="sendSuggestion('How do I contact support?')">💬 Contact support</button>
      </div>

      <!-- Chat Messages -->
      <div class="chat-area" id="chat-area">
        <div class="msg-row bot">
          <div class="bubble">
            Hi there! 👋 I'm your FAQ Assistant. Tap a suggestion above or ask me anything about orders, shipping, returns, or payments!
          </div>
        </div>
      </div>

      <!-- Input Area -->
      <div class="chat-footer">
        <div class="input-wrap">
          <input
            type="text"
            id="user-input"
            placeholder="Ask a question about your order..."
            autocomplete="off"
          />
        </div>
        <button class="send-btn" id="send-btn" aria-label="Send message">
          ➤
        </button>
      </div>

    </div>
  </div>

  <script>
    const chatArea = document.getElementById("chat-area");
    const userInput = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");

    // ── Hide suggestions after first interaction ───────────────────────
    function hideSuggestions() {
      const s = document.getElementById("suggestions");
      if (s) s.style.display = "none";
    }

    // ── Add a message bubble ───────────────────────────────────────────
    function addMessage(text, role, matched = null, score = null) {
      const row = document.createElement("div");
      row.classList.add("msg-row", role);

      const bubble = document.createElement("div");
      bubble.classList.add("bubble");
      bubble.textContent = text;
      row.appendChild(bubble);

      // Show match info below bot replies
      if (matched && role === "bot") {
        const meta = document.createElement("div");
        meta.classList.add("meta-tag");
        const pct = Math.round(score * 100);
        const barW = Math.min(pct / 3, 34);
        meta.innerHTML = `
          <span class="score-bar" style="width:${barW}px"></span>
          Matched: "${matched}" · ${pct}% confidence
        `;
        row.appendChild(meta);
      }

      chatArea.appendChild(row);
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    // ── Typing animation ───────────────────────────────────────────────
    function showTyping() {
      const row = document.createElement("div");
      row.classList.add("msg-row", "bot");
      row.id = "typing-indicator";

      const bub = document.createElement("div");
      bub.classList.add("typing-bubble");
      bub.innerHTML = `
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      `;
      row.appendChild(bub);
      chatArea.appendChild(row);
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    function removeTyping() {
      const t = document.getElementById("typing-indicator");
      if (t) t.remove();
    }

    // ── Send question to Flask backend ─────────────────────────────────
    async function sendMessage(question) {
      question = question || userInput.value.trim();
      if (!question) return;

      hideSuggestions();
      addMessage(question, "user");
      userInput.value = "";
      showTyping();

      try {
        const response = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question: question })
        });

        const data = await response.json();
        removeTyping();

        addMessage(data.answer, "bot", data.matched, data.score);

      } catch (error) {
        removeTyping();
        addMessage("Something went wrong. Please check your connection and try again.", "bot");
      }
    }

    // ── Suggestion button handler ──────────────────────────────────────
    function sendSuggestion(text) {
      sendMessage(text);
    }

    // ── Event Listeners ────────────────────────────────────────────────
    sendBtn.addEventListener("click", () => sendMessage());
    userInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMessage();
    });
  </script>

</body>
</html>
